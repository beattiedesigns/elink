<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Conference Room Display</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 800px;
      height: 480px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: white;
      color: black;
    }

    body.loading .screen { visibility: hidden; }

    body.loading::before {
      content: "Loading live data...";
      display: flex;
      align-items: center;
      justify-content: center;
      width: 800px;
      height: 480px;
      font-size: 28px;
      font-weight: 700;
    }

    .screen {
      width: 800px;
      height: 480px;
      display: grid;
      grid-template-columns: 600px 200px;
      grid-template-rows: 400px 80px;
    }

    .main {
      padding: 28px 55px;
      position: relative;
    }

    .room-title {
      font-size: 34px;
      font-weight: 400;
      margin: 0;
    }

    .status {
      font-size: 88px;
      font-weight: 800;
      margin-top: 90px;
    }

    .current-booking {
      position: absolute;
      bottom: 28px;
      left: 55px;
      font-size: 16px;
      font-weight: 600;
    }

    .side {
      grid-column: 2;
      grid-row: 1 / 3;
      border-left: 3px solid #000;
      display: grid;
      grid-template-rows: 190px 290px;
      background: #fff;
    }

    .qr-box {
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .qr-box img {
      width: 145px;
      height: 145px;
      object-fit: contain;
    }

    .tokens {
      background: #000;
      color: #fff;
      padding: 25px;
      overflow: hidden;
      text-align: center;
    }

    .tokens h2 {
      font-size: 20px;
      margin: 0 0 28px 0;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .tokens p {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      margin: 0 0 28px 0;
      line-height: 1.3;
    }

    .footer {
      grid-column: 1;
      grid-row: 2;
      background: #efefef;
      padding: 30px 55px;
      font-size: 16px;
      font-weight: 600;
    }

    .footer strong { font-weight: 800; }

    body.occupied .main {
      background: #000;
      color: #fff;
    }

    body.occupied .side {
      border-left: 3px solid #fff;
      background: #fff;
    }

    body.occupied .qr-box {
      background: #fff;
    }

    body.occupied .tokens {
      background: #fff !important;
      color: #000 !important;
      border-top: 3px solid #000;
    }

    body.occupied .tokens h2,
    body.occupied .tokens p {
      color: #000 !important;
    }
  </style>
</head>

<body>

  <div class="screen">

    <main class="main">
      <h1 class="room-title" id="roomName">Conference Room</h1>
      <div class="status" id="status">Updating..</div>
      <div class="current-booking" id="currentBooking"></div>
    </main>

    <aside class="side">
      <div class="qr-box">
        <img id="qrCode" src="qr.png" alt="QR Code">
      </div>

      <div class="tokens">
        <h2>WIFI TOKENS</h2>
        <p id="token1"></p>
        <p id="token2"></p>
        <p id="token3"></p>
        <p id="token4"></p>
      </div>
    </aside>

    <footer class="footer">
      <span id="nextMeeting"></span>
    </footer>

  </div>

<script>
  const DATA_URL =
    "https://script.google.com/macros/s/AKfycbzTVqtEmLATLY1SD1m7I_OjKktPueK1_Im-aJdLz1Bgvrd-XsQMTPduH7qVkh47uhSazg/exec";

  let lastDataString = "";
  let timeoutTimer;

  // Show the screen immediately
  document.body.classList.remove("loading");

  function updateDisplay(data) {
    clearTimeout(timeoutTimer);

    const newDataString = JSON.stringify(data);

    if (newDataString !== lastDataString) {
      lastDataString = newDataString;

      document.getElementById("roomName").innerText =
        data.roomName || "Pencell Conference Room";

      const roomStatus = data.status || "Available";
      document.getElementById("status").innerText = roomStatus;

      if (roomStatus.toLowerCase() === "occupied") {
        document.body.classList.add("occupied");
      } else {
        document.body.classList.remove("occupied");
      }

      document.getElementById("currentBooking").innerText =
        data.currentBooking || data.current || "";

      document.getElementById("nextMeeting").innerText =
        data.nextMeeting || "";

      const tokens = data.wifiTokens || [];

      document.getElementById("token1").innerText = tokens[0] || "";
      document.getElementById("token2").innerText = tokens[1] || "";
      document.getElementById("token3").innerText = tokens[2] || "";
      document.getElementById("token4").innerText = tokens[3] || "";

      document.getElementById("qrCode").src = "qr.png";
    }
  }

  function showError() {
    document.getElementById("roomName").innerText = "Pencell Conference Room";
    document.getElementById("status").innerText = "Available";
    document.getElementById("nextMeeting").innerText =
      "Live data temporarily unavailable";
    document.body.classList.remove("occupied");
    document.body.classList.remove("loading");
  }

  function loadData() {
    const oldScript = document.getElementById("jsonpScript");
    if (oldScript) oldScript.remove();

    timeoutTimer = setTimeout(showError, 15000);

    const script = document.createElement("script");
    script.id = "jsonpScript";

    script.src =
      DATA_URL +
      "?callback=updateDisplay&t=" +
      Date.now();

    script.onerror = showError;

    document.body.appendChild(script);
  }

  loadData();
  setInterval(loadData, 120000);

  setInterval(function () {
  window.location.reload(true);
}, 300000);

</script>

</body>
</html>
